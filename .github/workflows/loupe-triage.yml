name: Loupe Visual Bug Auto-Triage

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to triage"
        required: true
        default: "379"

permissions: {}

concurrency:
  group: loupe-triage-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-triage') ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/triage')
      )
    steps:
      - name: Authorize trigger & invoke Cloud Run Loupe Triage Service
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || '' }}
          WHITELIST_USERS: ${{ vars.TRIAGE_WHITELIST_USERS || '' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          event = os.environ["EVENT_NAME"]
          actor = os.environ.get("ACTOR", "").strip().lower()
          assoc = os.environ.get("AUTHOR_ASSOC", "").strip().upper()
          whitelist = {
              u.strip().lower().lstrip("@")
              for u in os.environ.get("WHITELIST_USERS", "").split(",")
              if u.strip()
          }

          if event == "issue_comment":
              allowed_assocs = {"OWNER", "MEMBER", "COLLABORATOR"}
              if assoc not in allowed_assocs and actor not in whitelist:
                  print(
                      f"Skipping /triage: @{actor} (association={assoc}) is neither a collaborator "
                      f"nor in TRIAGE_WHITELIST_USERS."
                  )
                  sys.exit(0)

          issue_number = int(os.environ["ISSUE_NUMBER"])
          repo = os.environ["REPO"]
          print(f"Authorized ({event} by @{actor}). Triggering Loupe triage for issue #{issue_number} in {repo}...")

          payload = json.dumps({
              "issue_number": issue_number,
              "repo": repo,
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://cwa-loupe-triage-205504954450.us-central1.run.app/triage",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              body = resp.read().decode("utf-8", errors="replace")
              print(f"HTTP {resp.status}: {body[:1000]}")
          PY
