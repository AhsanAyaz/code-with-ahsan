name: Consulting Review Requests

on:
  # Run daily at 18:00 UTC (8:00 PM CEST / 11:00 PM PKT, after afternoon consulting slots)
  schedule:
    - cron: '0 18 * * *'

  # Allow manual trigger from GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  send-review-requests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send review request emails
        env:
          NODE_ENV: production
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: "https://www.codewithahsan.dev"
        run: npx tsx scripts/send-consulting-review-requests.ts
