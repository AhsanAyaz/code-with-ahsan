name: PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-verify:
    name: PR Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build generated content indexes
        run: npm run content:build && npm run build:events

      - name: Generate Next.js type definitions
        run: npx next typegen

      - name: Check Firestore composite indexes
        run: npm run check:firestore-indexes

      - name: Lint changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1 || true
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' || true)
          if [ -z "${CHANGED_FILES}" ]; then
            echo "No JS/TS files changed — skipping eslint."
          else
            echo "Linting changed files:"
            echo "${CHANGED_FILES}"
            echo "${CHANGED_FILES}" | tr '\n' '\0' | xargs -0 npx eslint
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
